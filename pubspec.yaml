name: lector_libros
description: Lector de libros en voz alta (PDF, EPUB, TXT) con voces naturales y traducción al español.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Voces naturales dentro del celular (Piper)
  sherpa_onnx:
  just_audio:
  audio_session:
  audio_service:
  # Voz del iPhone (respaldo)
  flutter_tts:
  # Libros
  file_picker: ^11.0.2
  syncfusion_flutter_pdf:
  pdfx:
  archive:
  xml:
  html:
  # Traducción y descargas
  http:
  # Datos y pantalla
  shared_preferences:
  path_provider:
  scrollable_positioned_list:
  google_fonts:

flutter:
  uses-material-design: true
