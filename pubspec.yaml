name: lector_libros
description: Lector de libros en voz alta (PDF, EPUB, TXT) con traducción al español.
publish_to: 'none'
version: 4.0.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Voz (motor propio, en packages/lector_tts)
  lector_tts:
    path: packages/lector_tts
  audio_service:
  # Libros
  file_picker: ^11.0.2
  syncfusion_flutter_pdf:
  pdfx:
  archive:
  xml:
  html:
  # Traducción y descargas
  http:
  # Datos y pantalla
  shared_preferences:
  path_provider:
  scrollable_positioned_list:
  google_fonts:

flutter:
  uses-material-design: true
