# Compila la app para iPhone en una Mac de Codemagic y deja un archivo
# Lector.ipa sin firmar, listo para instalar con Sideloadly desde Windows.
workflows:
  iphone-sideloadly:
    name: iPhone para Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Preparar Flutter
        script: |
          set -e
          # El traductor de Google solo funciona con Swift Package Manager.
          flutter config --enable-swift-package-manager
          flutter --version

      - name: Crear la carpeta de iOS si no existe
        script: |
          set -e
          if [ ! -d ios ]; then
            flutter create --platforms=ios --org com.banessa --project-name lector_libros .
          fi

      - name: Ajustes de iOS (segundo plano, archivos, versión mínima)
        script: |
          set -e
          PLIST=ios/Runner/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Delete :UIBackgroundModes" $PLIST 2>/dev/null || true
          $PB -c "Add :UIBackgroundModes array" $PLIST
          $PB -c "Add :UIBackgroundModes:0 string audio" $PLIST
          $PB -c "Delete :UIFileSharingEnabled" $PLIST 2>/dev/null || true
          $PB -c "Add :UIFileSharingEnabled bool true" $PLIST
          $PB -c "Delete :LSSupportsOpeningDocumentsInPlace" $PLIST 2>/dev/null || true
          $PB -c "Add :LSSupportsOpeningDocumentsInPlace bool true" $PLIST
          $PB -c "Set :CFBundleDisplayName Lector" $PLIST 2>/dev/null || $PB -c "Add :CFBundleDisplayName string Lector" $PLIST

          # El traductor de Google necesita iOS 15.5 o más nuevo.
          if grep -q "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          elif grep -q "^# platform :ios" ios/Podfile; then
            sed -i '' "s/^# platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          else
            { echo "platform :ios, '15.5'"; cat ios/Podfile; } > Podfile.tmp && mv Podfile.tmp ios/Podfile
          fi
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g' ios/Runner.xcodeproj/project.pbxproj

      - name: Descargar paquetes
        script: |
          set -e
          flutter pub get
          # Genera la configuración de Xcode y corre pod install.
          flutter build ios --release --no-codesign --config-only

      - name: Compilar y armar el .ipa
        script: |
          #!/bin/bash
          set -e
          mkdir -p build/logs
          XC_FAIL=0
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build > build/logs/xcodebuild.log 2>&1 || XC_FAIL=1

          echo "===== Líneas con errores ====="
          grep -inE "error|failed|undefined|cannot|not found" build/logs/xcodebuild.log | grep -v "warning:" | tail -n 120 || true

          if [ "$XC_FAIL" = "1" ]; then
            echo ""
            echo "===== Final del registro de Xcode ====="
            tail -n 150 build/logs/xcodebuild.log
            exit 1
          fi

          APP=build/dd/Build/Products/Release-iphoneos/Runner.app
          if [ ! -f "$APP/Frameworks/App.framework/App" ]; then
            echo "La app quedó incompleta (falta App.framework)"
            ls -la "$APP" "$APP/Frameworks" || true
            exit 1
          fi
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa && zip -qry Lector.ipa Payload
          ls -lh Lector.ipa

    artifacts:
      - build/ipa/Lector.ipa
      - build/logs/*.log
