name: lector_tts
description: Voz nativa (iOS AVSpeechSynthesizer y Android TextToSpeech) para la app Lector.
version: 0.0.2
publish_to: 'none'

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LectorTtsPlugin
      android:
        package: com.lector.lector_tts
        pluginClass: LectorTtsPlugin
